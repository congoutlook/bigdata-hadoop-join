name: bigdata-hadoop-join   # tên project cố định, tránh trùng với project khác cũng nằm trong thư mục "docker"

services:
  bigdata:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bigdata-container
    hostname: bigdata
    tty: true
    stdin_open: true
    volumes:
      - ../data:/data
    working_dir: /workspace
    restart: unless-stopped
    ports:
      - "9870:9870"   # HDFS NameNode Web UI
      - "9868:9868"   # HDFS SecondaryNameNode Web UI
      - "9864:9864"   # HDFS DataNode Web UI
      - "9000:9000"   # HDFS RPC (fs.defaultFS)
      - "8089:8088"   # YARN ResourceManager Web UI
      - "8042:8042"   # YARN NodeManager Web UI
      - "19888:19888" # MapReduce JobHistory Server Web UI

  # MySQL dùng để kiểm chứng kết quả MapReduce Join bằng SQL INNER JOIN
  mysql:
    image: mysql:8.0
    container_name: bigdata-mysql
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"   # root không dùng; tài khoản làm việc là admin / "" (tạo trong init script)
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ../data/mapreduce-join/customers.csv:/csv-src/customers.csv:ro
      - ../data/mapreduce-join/orders.csv:/csv-src/orders.csv:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"   # 3306 trên host đã có MySQL khác dùng

volumes:
  mysql-data:
